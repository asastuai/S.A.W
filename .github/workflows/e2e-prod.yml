name: e2e-prod

on:
  schedule:
    # Hourly smoke test against production
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm -F @asastuai/saw-web exec playwright install --with-deps chromium
      - run: pnpm -F @asastuai/saw-web exec playwright test
        env:
          PLAYWRIGHT_BASE_URL: https://saw-gilt.vercel.app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
