[package]
name = "agent_wallet"
version = "0.1.0"
description = "SAW agent_wallet program — PDA-based wallet with policy enforcement and human-in-the-loop approval"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "agent_wallet"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build",
    "policy_registry/idl-build",
    "approval_queue/idl-build",
]

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = { version = "0.31.1", features = ["token", "token_2022"] }
policy_registry = { path = "../policy_registry", default-features = false, features = ["no-entrypoint"] }
approval_queue = { path = "../approval_queue", default-features = false, features = ["no-entrypoint"] }
